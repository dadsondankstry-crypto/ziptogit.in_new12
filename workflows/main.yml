name: APK prototipo Nine Kingdom Kotlin
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Instalar SDK Android
        run: sdkmanager --install "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compilar APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verificar e nomear APK
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk || { echo "ERRO: APK não foi criado"; exit 1; }
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/nk-kotlin-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: nk-kotlin-debug-apk
          path: dist/nk-kotlin-debug.apk
          if-no-files-found: error
